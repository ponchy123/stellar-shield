<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarShield - 隐私转账</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            padding: 40px 0 30px;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #8892b0; font-size: 14px; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        .wallet-section {
            text-align: center;
            padding: 20px 0;
        }
        .wallet-btn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .wallet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,217,255,0.3);
        }
        .wallet-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .wallet-address {
            margin-top: 12px;
            font-size: 13px;
            color: #8892b0;
            word-break: break-all;
        }
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: transparent;
            color: #8892b0;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab.active {
            background: rgba(0,217,255,0.1);
            border-color: #00d9ff;
            color: #00d9ff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccd6f6;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #00d9ff; }
        .form-group input::placeholder { color: #5a6a8a; }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,217,255,0.3);
        }
        .submit-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .status.success { background: rgba(0,255,136,0.1); border: 1px solid #00ff88; color: #00ff88; }
        .status.error { background: rgba(255,71,87,0.1); border: 1px solid #ff4757; color: #ff4757; }
        .status.loading { background: rgba(0,217,255,0.1); border: 1px solid #00d9ff; color: #00d9ff; }
        .features { padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .features h3 { color: #ccd6f6; font-size: 16px; margin-bottom: 12px; }
        .feature-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            color: #8892b0;
            font-size: 14px;
        }
        .feature-item::before {
            content: "✓";
            color: #00ff88;
            margin-right: 10px;
            font-weight: bold;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tx-link {
            color: #00d9ff;
            text-decoration: none;
            word-break: break-all;
        }
        .tx-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>StellarShield</h1>
            <p>Zero-Knowledge Privacy on Stellar</p>
        </div>

        <div class="card wallet-section">
            <button id="connect-wallet" class="wallet-btn">Connect Freighter</button>
            <div id="wallet-address" class="wallet-address"></div>
        </div>

        <div class="card">
            <div class="tab-container">
                <button class="tab active" data-tab="deposit">Deposit</button>
                <button class="tab" data-tab="transfer">Transfer</button>
                <button class="tab" data-tab="withdraw">Withdraw</button>
            </div>

            <div id="deposit" class="tab-content active">
                <div class="form-group">
                    <label>Amount (units)</label>
                    <input type="number" id="deposit-amount" placeholder="e.g. 1000000000" min="1">
                </div>
                <div class="form-group">
                    <label>Secret (hex, 64 chars)</label>
                    <input type="text" id="deposit-secret" placeholder="Auto-generated if empty" maxlength="64">
                </div>
                <button id="deposit-btn" class="submit-btn" disabled>Deposit</button>
                <div id="deposit-status" class="status"></div>
            </div>

            <div id="transfer" class="tab-content">
                <div class="form-group">
                    <label>Commitment Index to Spend</label>
                    <input type="number" id="transfer-index" placeholder="e.g. 0" min="0">
                </div>
                <div class="form-group">
                    <label>Secret (hex)</label>
                    <input type="text" id="transfer-secret" placeholder="Your secret" maxlength="64">
                </div>
                <div class="form-group">
                    <label>New Commitment (hex, 64 chars)</label>
                    <input type="text" id="transfer-new-commitment" placeholder="New commitment hash" maxlength="64">
                </div>
                <div class="form-group">
                    <label>Nullifier Hash (hex, 64 chars)</label>
                    <input type="text" id="transfer-nullifier" placeholder="Nullifier hash" maxlength="64">
                </div>
                <button id="transfer-btn" class="submit-btn" disabled>Transfer</button>
                <div id="transfer-status" class="status"></div>
            </div>

            <div id="withdraw" class="tab-content">
                <div class="form-group">
                    <label>Commitment Index to Spend</label>
                    <input type="number" id="withdraw-index" placeholder="e.g. 0" min="0">
                </div>
                <div class="form-group">
                    <label>Secret (hex)</label>
                    <input type="text" id="withdraw-secret" placeholder="Your secret" maxlength="64">
                </div>
                <div class="form-group">
                    <label>Nullifier Hash (hex, 64 chars)</label>
                    <input type="text" id="withdraw-nullifier" placeholder="Nullifier hash" maxlength="64">
                </div>
                <div class="form-group">
                    <label>Amount to Withdraw</label>
                    <input type="number" id="withdraw-amount" placeholder="e.g. 1000000000" min="1">
                </div>
                <button id="withdraw-btn" class="submit-btn" disabled>Withdraw</button>
                <div id="withdraw-status" class="status"></div>
            </div>
        </div>

        <div class="card features">
            <h3>Features</h3>
            <div class="feature-item">Zero-knowledge balance proofs</div>
            <div class="feature-item">Anonymous transfers via nullifiers</div>
            <div class="feature-item">On-chain commitment storage</div>
            <div class="feature-item">Client-side proof generation</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.5/build/snark.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
